name: grocery_app
description: GroceryGo - A modern grocery shopping application built with Flutter.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  get: ^4.6.6

  # Local storage
  shared_preferences: ^2.2.2

  # Network
  connectivity_plus: ^5.0.2
  http: ^1.1.0

  # Image handling
  cached_network_image: ^3.3.1

  # UI Components
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^4.2.1
  flutter_rating_bar: ^4.0.1
  flutter_staggered_grid_view: ^0.7.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
